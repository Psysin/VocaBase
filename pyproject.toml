[project]
name = "VocaBase"
version = "1.1.0"
description = "Spaced-Repetition Vokabeltrainer"
dependencies = ["flet-audio==0.86.5"]

[tool.flet]
product = "VocaBase"

# scripts/ ist ein reines Entwickler-Tool (Audio-Generierung am Mac) und
# soll nicht mit ins gebaute App-Paket wandern.
[tool.flet.app]
exclude = ["scripts"]

[tool.flet.splash]
color = "#1565C0"
dark_color = "#1565C0"

# Macht den Documents-Ordner der App (dort liegt app_data.json) in der
# iOS Files-App sichtbar ("Auf meinem iPhone" -> VocaBase), damit sich die
# Datei per AirDrop/Files-App auf den Mac sichern und wieder zurückspielen
# lässt - z.B. vor einem größeren Architektur-Umbau der App.
[tool.flet.ios.info]
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
